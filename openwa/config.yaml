name: WhatsApp Bridge
version: "0.2.1"
slug: openwa
description: Connect Home Assistant to WhatsApp via whatsapp-web.js, bridged over MQTT (send + receive)
url: https://github.com/giladmeir/ha-openwa/tree/main/openwa
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8090]/health"
services:
  - mqtt:need
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Internal health endpoint (used by the add-on watchdog)
options:
  session_id: ha
  base_topic: openwa
  discovery_prefix: homeassistant
  user_agent: ""
  chromium_args: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu"
  web_version: ""
  protocol_timeout: 120000
  create_retries: 3
  log_level: info
schema:
  session_id: str
  base_topic: str
  discovery_prefix: str
  user_agent: str?
  chromium_args: str?
  web_version: str?
  protocol_timeout: int(30000,600000)
  create_retries: int(0,10)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
