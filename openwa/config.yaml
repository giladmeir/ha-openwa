name: WhatsApp Bridge
version: "0.6.0"
slug: openwa
description: Connect Home Assistant to WhatsApp via whatsapp-web.js, bridged over MQTT (send + receive)
url: https://github.com/giladmeir/ha-openwa/tree/main/openwa
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:whatsapp
panel_title: WhatsApp
watchdog: "http://[HOST]:[PORT:8099]/health"
services:
  - mqtt:need
ports:
  8099/tcp: null
  8098/tcp: 8098
ports_description:
  8099/tcp: Web UI + health endpoint (QR scanning, add-on watchdog)
  8098/tcp: HTTP send API for external services (requires api_key)
options:
  session_id: ha
  base_topic: openwa
  discovery_prefix: homeassistant
  user_agent: ""
  chromium_args: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu"
  web_version: ""
  self_command_prefix: ""
  self_poll_seconds: 4
  poll_chat_ids: ""
  api_key: ""
  default_send_to: ""
  protocol_timeout: 120000
  create_retries: 3
  log_level: info
schema:
  session_id: str
  base_topic: str
  discovery_prefix: str
  user_agent: str?
  chromium_args: str?
  web_version: str?
  self_command_prefix: str?
  self_poll_seconds: int(0,60)
  poll_chat_ids: str?
  api_key: str?
  default_send_to: str?
  protocol_timeout: int(30000,600000)
  create_retries: int(0,10)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
