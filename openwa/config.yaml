name: WhatsApp Bridge (open-wa)
version: "0.1.0"
slug: openwa
description: Connect Home Assistant to WhatsApp via open-wa, bridged over MQTT (send + receive)
url: https://github.com/giladmeir/ha-openwa/tree/main/openwa
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
watchdog: "http://[HOST]:[PORT:8090]/health"
services:
  - mqtt:need
ports:
  8090/tcp: null
ports_description:
  8090/tcp: Internal health endpoint (used by the add-on watchdog)
options:
  session_id: ha
  base_topic: openwa
  discovery_prefix: homeassistant
  license_key: ""
  log_level: info
schema:
  session_id: str
  base_topic: str
  discovery_prefix: str
  license_key: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
